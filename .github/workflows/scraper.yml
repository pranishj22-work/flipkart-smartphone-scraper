name: Flipkart Smartphone Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python scraper.py

      - name: Rename output with India date
        run: |
          SCRAPE_DATE=$(TZ=Asia/Kolkata date +"%Y-%m-%d")
          mv 7th_flipkart_mobile_assortment_v5.xlsx \
             "flipkart_mobile_assortment_${SCRAPE_DATE}.xlsx"

      - name: Upload Excel as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-mobile-assortment
          path: "*.xlsx"
          if-no-files-found: error